<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do Lister</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📝 To-Do Lister</h1>
            <p>Organize suas tarefas de forma simples</p>
        </header>

        <div class="input-section">
            <input 
                type="text" 
                id="taskInput" 
                placeholder="Digite uma nova tarefa..."
                onkeypress="handleKeyPress(event)"
            >
            <button onclick="addTask()">Adicionar</button>
        </div>

        <div class="filter-section">
            <button class="filter-btn active" onclick="filterTasks('all')">Todas</button>
            <button class="filter-btn" onclick="filterTasks('pending')">Pendentes</button>
            <button class="filter-btn" onclick="filterTasks('completed')">Concluídas</button>
        </div>

        <ul id="taskList" class="task-list">
            <!-- Tarefas serão adicionadas aqui dinamicamente -->
        </ul>

        <div class="stats">
            <span id="taskCount">Total: 0 tarefas</span>
            <button onclick="clearCompleted()" class="clear-btn">Limpar Concluídas</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
