<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do Lister</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- BOTÃO DE ALTO CONTRASTE - ADICIONE ESTA LINHA -->
    <button id="highContrastBtn" class="contrast-btn" onclick="toggleHighContrast()" aria-label="Ativar modo de alto contraste">
        🌙 Alto Contraste
    </button>

    <div class="container">
        <h1>Lista de Tarefas</h1>
        
        <div class="input-section">
            <input type="text" id="taskInput" placeholder="Digite uma nova tarefa...">
            <button id="addTaskBtn">Adicionar Tarefa</button>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">Todas</button>
            <button class="filter-btn" data-filter="pending">Pendentes</button>
            <button class="filter-btn" data-filter="completed">Concluídas</button>
        </div>

        <ul id="taskList" class="task-list"></ul>

        <div class="task-info">
            <span id="taskCount">0 tarefas pendentes</span>
            <button id="clearCompleted">Limpar Concluídas</button>
        </div>
    </div>

    <script src="script.js"></script>
        <!-- FEEDBACK PARA LEITOR DE TELA -->
    <div id="ariaAnnouncer" aria-live="polite" aria-atomic="true" style="position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden;">
    </div>
</body>
</html>
