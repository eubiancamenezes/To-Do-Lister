<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List App</title>
    <style>
        :root {
            --primary-color: #6366f1;
            --bg-color: #ffffff;
            --text-color: #1f2937;
            --border-color: #e5e7eb;
            --hover-color: #f3f4f6;
        }

        [data-theme="dark"] {
            --primary-color: #818cf8;
            --bg-color: #1f2937;
            --text-color: #f9fafb;
            --border-color: #374151;
            --hover-color: #374151;
        }

        [data-theme="blue"] {
            --primary-color: #3b82f6;
            --bg-color: #dbeafe;
            --text-color: #1e3a8a;
            --border-color: #93c5fd;
            --hover-color: #bfdbfe;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: all 0.3s ease;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: var(--bg-color);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: var(--primary-color);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .controls {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-controls {
            display: flex;
            gap: 8px;
        }

        .theme-controls {
            display: flex;
            gap: 8px;
            margin-left: auto;
        }

        .theme-btn, .filter-btn {
            padding: 8px 16px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-color);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
        }

        .theme-btn:hover, .filter-btn:hover {
            background: var(--hover-color);
        }

        .theme-btn.active, .filter-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .main-content {
            padding: 20px;
        }

        .task-form {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        #task-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            background: var(--bg-color);
            color: var(--text-color);
            transition: border-color 0.2s ease;
        }

        #task-input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .add-btn {
            padding: 12px 24px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: opacity 0.2s ease;
        }

        .add-btn:hover {
            opacity: 0.9;
        }

        .task-stats {
            margin-bottom: 20px;
            padding: 16px;
            background: var(--hover-color);
            border-radius: 8px;
            font-size: 0.9rem;
        }

        #task-list {
            list-style: none;
            margin-bottom: 20px;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 10px;
            transition: all 0.2s ease;
            background: var(--bg-color);
        }

        .task-item:hover {
            background: var(--hover-color);
        }

        .task-item.completed {
            opacity: 0.6;
        }

        .task-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .task-text {
            flex: 1;
            font-size: 1rem;
            word-break: break-word;
        }

        .task-item.completed .task-text {
            text-decoration: line-through;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 1.2rem;
            transition: background-color 0.2s ease;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .delete-btn:hover {
            background: #fecaca;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-color);
            opacity: 0.6;
        }

        .empty-state h3 {
            margin-bottom: 8px;
            font-size: 1.3rem;
        }

        .keyboard-shortcut {
            margin-top: 20px;
            font-size: 0.8rem;
            opacity: 0.7;
            text-align: center;
            padding: 10px;
            border-top: 1px solid var(--border-color);
        }

        kbd {
            background: var(--hover-color);
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            font-size: 0.7rem;
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            
            .theme-controls {
                margin-left: 0;
                justify-content: center;
            }
            
            .task-form {
                flex-direction: column;
            }
            
            .filter-controls {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📝 Todo List</h1>
            <p>Organize suas tarefas de forma simples</p>
        </div>

        <div class="controls">
            <div class="filter-controls">
                <button class="filter-btn active" data-filter="all">Todas</button>
                <button class="filter-btn" data-filter="active">Ativas</button>
                <button class="filter-btn" data-filter="completed">Concluídas</button>
            </div>
            <div class="theme-controls">
                <button class="theme-btn" data-theme="light">☀️</button>
                <button class="theme-btn" data-theme="dark">🌙</button>
                <button class="theme-btn" data-theme="blue">🔵</button>
            </div>
        </div>

        <div class="main-content">
            <form id="task-form" class="task-form">
                <input 
                    type="text" 
                    id="task-input" 
                    placeholder="Digite uma nova tarefa..." 
                    autocomplete="off"
                    aria-label="Nova tarefa"
                >
                <button type="submit" class="add-btn">Adicionar</button>
            </form>

            <div class="task-stats">
                <span id="task-counter">0 tarefas restantes</span>
            </div>

            <div id="empty-state" class="empty-state" style="display: none;">
                <h3>Nenhuma tarefa encontrada</h3>
                <p>Adicione uma nova tarefa para começar!</p>
            </div>

            <ul id="task-list"></ul>

            <div class="keyboard-shortcut">
                💡 Dica: Use <kbd>Ctrl</kbd> + <kbd>/</kbd> para focar no campo de tarefa
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
