<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do-Lister - Lista de Tarefas Acessível</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="#main-content" class="skip-link">Pular para o conteúdo principal</a>
    
    <header class="header" role="banner">
        <h1>To-Do-Lister</h1>
        <div class="theme-controls">
            <button id="dark-mode-toggle" aria-pressed="false">🌙 Modo Escuro</button>
            <button id="high-contrast-toggle" aria-pressed="false">⚫ Alto Contraste</button>
        </div>
    </header>

    <main id="main-content" class="main" role="main">
        <section class="add-task" aria-labelledby="add-task-heading">
            <h2 id="add-task-heading">Adicionar Nova Tarefa</h2>
            <form id="task-form" class="task-form">
                <label for="task-input" class="visually-hidden">Nova tarefa</label>
                <input type="text" id="task-input" placeholder="Digite sua tarefa...">
                <button type="submit">Adicionar</button>
            </form>
        </section>

        <section class="filters-section">
            <div class="filters" role="group" aria-label="Filtrar tarefas">
                <button class="filter-btn active" data-filter="all">Todas</button>
                <button class="filter-btn" data-filter="active">Ativas</button>
                <button class="filter-btn" data-filter="completed">Concluídas</button>
            </div>
        </section>

        <section class="tasks-section">
            <ul id="task-list" class="task-list" aria-live="polite"></ul>
        </section>

        <div class="stats" aria-live="polite">
            <span id="task-counter">0 tarefas restantes</span>
        </div>
    </main>

    <footer class="footer" role="contentinfo">
        <p>To-Do-Lister - 2024 - Entrega IV</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
